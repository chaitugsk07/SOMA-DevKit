name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soma
          POSTGRES_PASSWORD: soma
          POSTGRES_DB: soma_common
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://soma:soma@localhost:5432/soma_common
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --no-default-features
      - run: cargo build --all-features
      - run: cargo test --all-features
