[package]
name = "soma-infra"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared backend primitives for the soma-platform: feature-gated Postgres, Redis, crypto, object storage, LLM, knowledge-graph, telemetry, and config helpers."
repository = "https://github.com/chaitugsk07/soma-infra"
homepage = "https://github.com/chaitugsk07/soma-infra"
readme = "README.md"
keywords = ["backend", "sqlx", "crypto", "redis", "llm"]
categories = ["database", "development-tools", "asynchronous"]
rust-version = "1.82"

# docs.rs documents the WHOLE crate, not just default features — otherwise only
# db + tracing would show and crypto/cache/storage/llm/kg/http/signal would be invisible.
[package.metadata.docs.rs]
all-features = true

# Every concern is behind its own feature so a consumer compiles only what it
# uses, and a change to one module never forces unrelated consumers to rebuild.
[features]
default = ["db", "tracing"]
db = ["dep:sqlx", "dep:tokio", "dep:thiserror"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
config = ["dep:thiserror"]
errors = ["dep:sqlx", "http", "dep:serde", "dep:serde_json", "reqwest/blocking"]
testing = ["db", "dep:uuid"]
cache = ["dep:redis", "dep:thiserror", "dep:tokio"]
crypto = ["dep:aes-gcm", "dep:argon2", "dep:zeroize", "dep:thiserror", "dep:hkdf", "dep:hmac", "dep:sha2"]
# ponytail: object_store pinned to 0.12 — 0.13+/0.14+ require rustc ≥1.85,
# but this crate's rust-version is 1.82. Latest 0.12.x patch: 0.12.5.
storage-s3    = ["dep:object_store", "object_store/aws",   "dep:bytes", "dep:thiserror"]
storage-azure = ["dep:object_store", "object_store/azure", "dep:bytes", "dep:thiserror"]
# storage-fs: local filesystem cold tier via object_store::local::LocalFileSystem.
# Requires the `fs` feature of object_store (gated behind that feature in 0.12).
# Purpose: integration tests without MinIO + homelab single-disk cold tier.
# Env: STORAGE_BACKEND="fs", STORAGE_FS_ROOT=<absolute-path>.
storage-fs    = ["dep:object_store", "object_store/fs",    "dep:bytes", "dep:thiserror"]
llm = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio", "tokio/time", "dep:async-trait", "dep:futures-core", "dep:async-stream", "dep:tracing"]
llm-tiktoken = ["llm", "dep:tiktoken-rs"]
http = ["dep:reqwest"]
signal = ["dep:tokio", "tokio/signal"]
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess", "dep:tokio", "tokio/net", "tokio/sync", "signal"]
kg = ["dep:sqlx", "dep:pgvector", "dep:serde_json", "dep:uuid", "dep:thiserror"]
# otlp: opt-in OTLP/HTTP export of traces + logs to a collector (e.g. soma-observe).
# Set OTEL_EXPORTER_OTLP_ENDPOINT (or SOMA_OBSERVE_URL) at runtime; if neither is
# set the feature is a no-op — stdout-only behavior is unchanged.
otlp = ["tracing", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-appender-tracing", "dep:tokio", "tokio/sync"]
# DKIM path: lettre 0.11's built-in `dkim` feature (RFC 6376 relaxed/relaxed, RSA-SHA256).
# Chosen over mail-auth because lettre already covers signing via its `dkim` feature (rsa + sha2
# with oid + ed25519-dalek) — no extra crate needed for the mechanism.  Verification is only
# used in unit tests (dev-dep rsa + sha2 + base64).
email = ["dep:lettre", "dep:thiserror"]
# push: APNs (ES256 JWT, HTTP/2), FCM (RS256 JWT → OAuth2), Web Push/VAPID (RFC 8291/8292).
# jsonwebtoken uses ring (already transitive via reqwest rustls) — pure Rust, no openssl.
# p256 is RustCrypto: P-256 ECDH for VAPID encryption + PKCS#8 key serialisation.
# VAPID payload encryption reuses aes-gcm, hkdf, sha2 already in the crypto feature.
# base64 is also in dev-deps; listed here as optional so push can encode/decode at runtime.
push = ["dep:reqwest", "dep:jsonwebtoken", "dep:p256", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:base64", "dep:aes-gcm", "dep:hkdf", "dep:sha2", "dep:tokio"]
# iam-client: generic ES256 JWKS verifier (fetch + in-memory cache + verify).
# Caller supplies claims type (C: DeserializeOwned). Algorithm locked to ES256.
# Two-env contract: SOMA_IAM_ISSUER (req, expected iss + default JWKS URL base),
# SOMA_IAM_JWKS_URL (opt, internal fetch URL), SOMA_IAM_AUDIENCE (opt, default "soma-console").
# Zero new deps — jsonwebtoken, serde_json, uuid, tokio/sync, thiserror already optional.
# axum_ext submodule (IamClaims<C> extractor, extract_token) enabled when `web` is also active.
iam-client = ["http", "dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:uuid", "dep:tokio", "tokio/sync", "dep:thiserror"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "derive"], optional = true, default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
thiserror = { version = "2", optional = true }
redis = { version = "0.25", features = ["tokio-comp", "aio", "connection-manager", "tokio-rustls-comp"], optional = true, default-features = false }
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true, default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"], optional = true }
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# ponytail: pinned to 0.12 — see storage-s3/storage-azure feature comments above
object_store = { version = "0.12", optional = true, default-features = false }
bytes = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], optional = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
pgvector = { version = "0.4", features = ["sqlx"], optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "matched-path", "original-uri", "json"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
opentelemetry = { version = "0.32", features = ["trace", "logs", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace", "logs", "metrics", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"], optional = true }
# http-proto + reqwest-client: HTTP/protobuf transport, no grpc/tonic.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "trace", "logs", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
# email feature: pooled async SMTP + DKIM signing via lettre's built-in dkim feature.
# ring is already transitive via reqwest's rustls — no new system libs introduced.
# ponytail: no native-tls anywhere; `ring` provider is pure Rust.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "tokio1-rustls", "ring", "webpki-roots", "builder", "dkim"], optional = true }
# push feature deps — pure Rust, no openssl/native-tls
jsonwebtoken = { version = "9", optional = true }
p256 = { version = "0.13", features = ["ecdh", "pkcs8"], optional = true }
base64 = { version = "0.22", optional = true }
async-trait = { version = "0.1", optional = true }
futures-core = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
tiktoken-rs = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"], default-features = false }
# DKIM round-trip verification test helpers (pure-Rust, no openssl/native-tls)
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
# push module mock-HTTP tests (pure Rust, tokio-compatible, no openssl)
wiremock = "0.6"
# iam-client tests: ES256 key generation (adds ecdsa to p256's existing ecdh+pkcs8 features)
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"

[[example]]
name = "otlp_roundtrip"
required-features = ["otlp"]

# Prevent Cargo from treating this crate as a member of a parent workspace
# when soma-infra is checked standalone (e.g. from within a suite that has its
# own workspace at the tree root). This has no effect when soma-infra is
# consumed as a path dependency — the parent workspace always wins there.
[workspace]

# No debuginfo in dev builds — keeps target/ small (debug builds otherwise
# bloat to GBs). Backtraces still show panic messages, just no line numbers.
# Prefer `cargo build --release` for real runs.
[profile.dev]
debug = false
strip = true
