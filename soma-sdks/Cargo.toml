[workspace]
resolver = "2"
members = [
    "crates/soma-crypto",
    "crates/soma-iam-sdk",
    "crates/soma-flags-core",
    "crates/soma-sdk",
]

# Keep dev target/ lean: debug = false drops all debuginfo, strip removes symbols.
# Prefer `cargo build --release` for real runs.
[profile.dev]
debug = false
strip = true
incremental = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chaitugsk07/SOMA-DevKit"
authors = ["Chaitu Gaddek <dev@kreesalis.com>"]
rust-version = "1.82"

[workspace.dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers / time
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async / HTTP client
tokio = { version = "1" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto / JWT
p256          = { version = "0.13", features = ["pkcs8", "ecdsa"] }
jsonwebtoken  = "9"
base64        = "0.22"
zeroize       = { version = "1", features = ["derive"] }
rand          = "0.8"
sha2          = "0.10"

# Error handling + observability
thiserror = "2"
anyhow = "1"
tracing = "0.1"
